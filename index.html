<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON STRIKER 2088</title>
    <style>
        /* [1. 기본 스타일 및 네온 테마 설정] */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 드래그 및 텍스트 선택 방지 */
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 게임 메인 컨테이너 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 900px;
            max-height: 1000px;
            background: radial-gradient(circle at center, #0c0d21 0%, #030308 100%);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.15), inset 0 0 20px rgba(255, 0, 127, 0.1);
            overflow: hidden;
        }

        /* 캔버스 요소 (게임이 실제로 그려지는 도화지) */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair; /* 마우스 커서를 조준선 모양으로 변경 */
        }

        /* [2. UI 상단 머리말 정보(HUD) 스타일] */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none; /* UI 레이어가 마우스 클릭을 방해하지 않도록 설정 */
            z-index: 10;
        }

        .hud-box {
            background: rgba(10, 10, 25, 0.65);
            border: 1px solid rgba(0, 240, 255, 0.4);
            padding: 10px 18px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            backdrop-filter: blur(5px);
        }

        .hud-title {
            font-size: 11px;
            color: #8899ac;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 24px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 10px #00f0ff;
            margin-top: 2px;
        }

        /* 필살기(스킬) 게이지 바 */
        .skill-container {
            margin-top: 6px;
            width: 140px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255, 0, 127, 0.5);
        }

        .skill-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff007f, #ff7700);
            box-shadow: 0 0 10px #ff007f;
            transition: width 0.1s linear;
        }

        /* [3. 오버레이 메인 메뉴 및 게임오버 화면] */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 15, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(8px);
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .main-title {
            font-size: 42px;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(45deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 240, 255, 0.5);
            margin-bottom: 10px;
            letter-spacing: 3px;
        }

        .sub-title {
            font-size: 14px;
            color: #a0a0c0;
            margin-bottom: 30px;
            text-align: center;
            line-height: 1.6;
        }

        /* 네온 버튼 스타일 */
        .btn-neon {
            padding: 14px 40px;
            font-size: 18px;
            font-weight: bold;
            color: #00f0ff;
            background: transparent;
            border: 2px solid #00f0ff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transition: all 0.2s ease;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-neon:hover {
            background: #00f0ff;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
            transform: scale(1.05);
        }

        /* 조작 가이드 안내창 */
        .controls-info {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 15px 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            color: #ccc;
            text-align: center;
            line-height: 1.8;
        }

        .key-badge {
            background: rgba(0, 240, 255, 0.2);
            color: #00f0ff;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- [4. 게임 인터페이스 구조 정의] -->
    <div id="game-container">
        <!-- 캔버스 (실제 가상 그래픽) -->
        <canvas id="gameCanvas"></canvas>

        <!-- 게임 상태 점수판 (HUD) -->
        <div class="hud-layer">
            <div class="hud-box">
                <div class="hud-title">SCORE / COMBO</div>
                <div class="hud-value" id="scoreDisplay">0</div>
            </div>

            <div class="hud-box" style="text-align: right;">
                <div class="hud-title">ULTIMATE SKILL</div>
                <div class="skill-container">
                    <div class="skill-bar" id="skillBar"></div>
                </div>
            </div>
        </div>

        <!-- 시작 / 게임 오버 오버레이 화면 -->
        <div class="overlay" id="startOverlay">
            <h1 class="main-title">NEON STRIKER<br>2088</h1>
            <p class="sub-title">사이보그 적들을 격파하고 최장 기록을 달성하세요!</p>
            <button class="btn-neon" id="startBtn">GAME START</button>

            <div class="controls-info">
                🎮 <b>조작법</b><br>
                이동: <span class="key-badge">마우스</span> 또는 <span class="key-badge">터치 드래그</span><br>
                기본 공격: <span class="key-badge">자동 발사</span><br>
                특수 궁극기: <span class="key-badge">클릭</span> 또는 <span class="key-badge">Spacebar</span> (게이지 100% 필요)
            </div>
        </div>
    </div>

    <script>
        /*
         * =================================================================
         * NEON STRIKER 2088 - 메인 게임 스크립트
         * =================================================================
         * 초보자 및 고등학생을 위한 구조 설명:
         * 1. SoundEngine: Web Audio API를 이용해 외부 소스 없이 가성 음악/효과음 생성
         * 2. Player, Bullet, Enemy, Particle, Star, FloatingText Class: 오브젝트 설계도
         * 3. GameLoop: 초당 60프레임으로 화면을 지속 갱신(Update & Render)
         * 4. EventListeners: 마우스, 터치, 키보드 등의 사용자 입력 처리
         */

        // [1. 사운드 엔진 (웹 오디오 API 활용 오디오 합성기)]
        class SoundEngine {
            constructor() {
                this.ctx = null; // 오디오 컨텍스트 객체
            }

            init() {
                // 브라우저 호환성을 위한 AudioContext 생성
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            // 기본 피우-피우 총소리
            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }

            // 적 폭발음 (쿵!)
            playExplode() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            // 궁극기 화려한 레이저 발사음
            playUltimate() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, this.ctx.currentTime + 0.5);
                
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.5);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.5);
            }
        }

        const sounds = new SoundEngine();

        // [2. 캔버스 및 전역 개체 초기화]
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const skillBar = document.getElementById('skillBar');
        const startOverlay = document.getElementById('startOverlay');
        const startBtn = document.getElementById('startBtn');

        // 해상도에 맞춘 캔버스 크기 재조정 함수
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 전역 상태 변수들
        let isGameRunning = false;
        let score = 0;
        let combo = 0;
        let comboTimer = 0;
        let skillGauge = 0; // 0 ~ 100%
        let lastTime = 0;
        let enemySpawnTimer = 0;
        let highScore = localStorage.getItem('neon_striker_high') || 0;

        // 게임 개체 관리 배열들
        let player;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        let floatingTexts = [];

        // [3. 우주 배경 별 클래스]
        class Star {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speed = Math.random() * 3 + 1;
                this.color = Math.random() > 0.5 ? '#00f0ff' : '#ff007f';
            }
            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.y = 0;
                    this.x = Math.random() * canvas.width;
                }
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.6;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        // [4. 플레이어 전투기 클래스]
        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.targetX = this.x;
                this.targetY = this.y;
                this.radius = 20; // 충돌 범위
                this.shootCooldown = 0;
            }

            update() {
                // 마우스/터치 위치로 부드럽게 이동 (보간법: Lerp)
                this.x += (this.targetX - this.x) * 0.15;
                this.y += (this.targetY - this.y) * 0.15;

                // 화면 밖 나감 방지
                this.x = Math.max(this.radius, Math.min(canvas.width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(canvas.height - this.radius, this.y));

                // 자동 총알 발사 타임 제어
                this.shootCooldown++;
                if (this.shootCooldown >= 8) { // 프레임 단위 연속 발사 간격
                    this.shoot();
                    this.shootCooldown = 0;
                }
            }

            shoot() {
                // 듀얼 광선 총알 생성
                bullets.push(new Bullet(this.x - 12, this.y - 15));
                bullets.push(new Bullet(this.x + 12, this.y - 15));
                sounds.playShoot();
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // 글로우 (네온 광원) 효과 설정
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00f0ff';

                // 기체 그리기 (삼각형 형태의 가상 전투기)
                ctx.beginPath();
                ctx.moveTo(0, -22);
                ctx.lineTo(-20, 18);
                ctx.lineTo(0, 10);
                ctx.lineTo(20, 18);
                ctx.closePath();
                ctx.fillStyle = '#00f0ff';
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 부스터 추진 불꽃 애니메이션
                ctx.beginPath();
                ctx.moveTo(-8, 15);
                ctx.lineTo(0, 28 + Math.random() * 10);
                ctx.lineTo(8, 15);
                ctx.fillStyle = '#ff007f';
                ctx.shadowColor = '#ff007f';
                ctx.fill();

                ctx.restore();
            }
        }

        // [5. 탄환(총알) 클래스]
        class Bullet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.speed = 16;
                this.radius = 4;
            }

            update() {
                this.y -= this.speed;
            }

            draw() {
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f0ff';
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // [6. 적(에일리언 사이보그) 클래스]
        class Enemy {
            constructor() {
                this.radius = Math.random() * 12 + 16; // 다양한 크기의 적
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -this.radius;
                this.speed = Math.random() * 2 + 2 + (score / 1000); // 점수가 높을수록 속도 가속
                this.hp = Math.floor(this.radius / 10); // 크기가 클수록 체력 증가
                this.maxHp = this.hp;
                this.color = Math.random() > 0.3 ? '#ff007f' : '#aa00ff';
                this.rotation = 0;
                this.rotSpeed = (Math.random() - 0.5) * 0.08;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 3;

                // 다각형 적 형태 채우기
                ctx.beginPath();
                ctx.strokeRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);
                ctx.fillStyle = 'rgba(20, 0, 30, 0.6)';
                ctx.fillRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);

                // 체력 비례 안쪽 피격 디테일
                if (this.hp < this.maxHp) {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillText(`${this.hp}`, -4, 4);
                }

                ctx.restore();
            }
        }

        // [7. 폭발 및 광원 파티클 클래스]
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                // 랜덤 방사형 분사 각도 및 속도
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 8 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1.0;
                this.decay = Math.random() * 0.03 + 0.015; // 서서히 사라짐
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // [8. 콤보 및 점수 팝업 텍스트 클래스]
        class FloatingText {
            constructor(text, x, y, color = '#00f0ff') {
                this.text = text;
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 1.0;
                this.vy = -2;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 18px "Segoe UI"';
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // [9. 파티클 수십개를 만드는 연쇄 폭발 효과 함수]
        function createExplosion(x, y, color, count = 25) {
            sounds.playExplode();
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // [10. 필살기 / 대폭발 특수 스킬 발사]
        function triggerUltimateSkill() {
            if (skillGauge < 100) return; // 게이지 미달시 거부

            skillGauge = 0; // 게이지 리셋
            skillBar.style.width = '0%';
            sounds.playUltimate();

            // 충격파 시각 효과 및 화면 모든 적 완전 섬멸
            for (let i = 0; i < 100; i++) {
                particles.push(new Particle(player.x, player.y, '#00f0ff'));
                particles.push(new Particle(player.x, player.y, '#ff007f'));
            }

            enemies.forEach(enemy => {
                createExplosion(enemy.x, enemy.y, enemy.color, 30);
                score += 100;
            });

            enemies = []; // 적 전체 제거
            floatingTexts.push(new FloatingText("ULTIMATE BLAST!!", canvas.width / 2 - 80, canvas.height / 2, '#ff007f'));
        }

        // [11. 충돌 판정 알고리즘 (두 원 사이의 거리 구하기)]
        function checkCircleCollision(c1, c2) {
            const dx = c1.x - c2.x;
            const dy = c1.y - c2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            return distance < (c1.radius + c2.radius);
        }

        // [12. 메인 업데이트 로직 (매 프레임마다 실행)]
        function update(deltaTime) {
            // 배경 별 업데이트
            stars.forEach(star => star.update());

            if (!isGameRunning) return;

            // 플레이어 움직임
            player.update();

            // 콤보 타이머 차감
            if (comboTimer > 0) {
                comboTimer--;
                if (comboTimer === 0) combo = 0; // 시간 초과 시 콤보 리셋
            }

            // 총알 배열 업데이트 및 정구
            bullets.forEach((bullet, index) => {
                bullet.update();
                // 화면 밖으로 나간 총알 제거
                if (bullet.y < -10) bullets.splice(index, 1);
            });

            // 적 생성 타이머
            enemySpawnTimer++;
            if (enemySpawnTimer > Math.max(15, 50 - Math.floor(score / 500))) {
                enemies.push(new Enemy());
                enemySpawnTimer = 0;
            }

            // 적 프레임 업데이트 및 충돌 검사
            enemies.forEach((enemy, eIndex) => {
                enemy.update();

                // 적이 화면 아래로 떨어진 경우 (게임 오버 조건)
                if (enemy.y - enemy.radius > canvas.height) {
                    gameOver();
                }

                // 플레이어와 적의 직접 충돌 감지
                if (checkCircleCollision(player, enemy)) {
                    createExplosion(player.x, player.y, '#00f0ff', 40);
                    gameOver();
                }

                // 총알과 적의 충돌 감지
                bullets.forEach((bullet, bIndex) => {
                    if (checkCircleCollision(bullet, enemy)) {
                        // 피격 처리
                        enemy.hp--;
                        bullets.splice(bIndex, 1); // 총알 제거

                        // 적 피격 소형 파티클 연출
                        for(let k=0; k<3; k++) particles.push(new Particle(bullet.x, bullet.y, '#ffffff'));

                        // 적 체력이 0이 되어 파괴된 경우
                        if (enemy.hp <= 0) {
                            createExplosion(enemy.x, enemy.y, enemy.color);
                            
                            // 콤보 및 점수 계산
                            combo++;
                            comboTimer = 120; // 약 2초간 콤보 유효시간 부여
                            const earnedScore = 50 * combo;
                            score += earnedScore;

                            // 특수 스킬 게이지 차오름
                            skillGauge = Math.min(100, skillGauge + 8);
                            skillBar.style.width = skillGauge + '%';

                            // 텍스트 연출 생성
                            floatingTexts.push(new FloatingText(`+${earnedScore}${combo > 1 ? ` (${combo} Combo!)` : ''}`, enemy.x, enemy.y, enemy.color));

                            enemies.splice(eIndex, 1); // 파괴된 적 배열 제거
                        }
                    }
                });
            });

            // 파티클 시스템 업데이트
            particles.forEach((p, index) => {
                p.update();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            // 플로팅 텍스트 업데이트
            floatingTexts.forEach((ft, index) => {
                ft.update();
                if (ft.alpha <= 0) floatingTexts.splice(index, 1);
            });

            // 화면 점수 UI 업데이트
            scoreDisplay.innerText = `${score} (COMBO x${combo})`;
        }

        // [13. 메인 화면 렌더링 (그리기)]
        function render() {
            // 잔상 효과를 위한 배경 투명 덧칠 (트레일 효과 연출)
            ctx.fillStyle = 'rgba(5, 5, 13, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 요소 별 그리기 호출
            stars.forEach(star => star.draw());
            particles.forEach(p => p.draw());
            bullets.forEach(bullet => bullet.draw());
            enemies.forEach(enemy => enemy.draw());
            
            if (isGameRunning && player) {
                player.draw();
            }

            floatingTexts.forEach(ft => ft.draw());
        }

        // [14. 통합 루프 함수 (Window.requestAnimationFrame)]
        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            update(deltaTime);
            render();

            requestAnimationFrame(gameLoop);
        }

        // [15. 게임 시작 및 오버 상태 변경 처리]
        function startGame() {
            sounds.init();
            score = 0;
            combo = 0;
            skillGauge = 0;
            skillBar.style.width = '0%';
            bullets = [];
            enemies = [];
            particles = [];
            floatingTexts = [];

            player = new Player();
            isGameRunning = true;
            startOverlay.classList.add('hidden');
        }

        function gameOver() {
            isGameRunning = false;
            sounds.playExplode();

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('neon_striker_high', highScore);
            }

            // 오버레이 메인 화면 재생성
            startOverlay.querySelector('.main-title').innerHTML = "GAME OVER";
            startOverlay.querySelector('.sub-title').innerHTML = `최종 점수: <b style="color:#00f0ff;">${score}</b><br>최고 기록: <b style="color:#ff007f;">${highScore}</b>`;
            startBtn.innerText = "RETRY";
            startOverlay.classList.remove('hidden');
        }

        // [16. 이벤트 리스너 등록 (마우스/터치/키보드 입력)]
        
        // 스타 50개 미리 생성
        for (let i = 0; i < 50; i++) stars.push(new Star());

        // 마우스 이동 시 좌표 업데이트
        window.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            if (player) {
                player.targetX = e.clientX - rect.left;
                player.targetY = e.clientY - rect.top;
            }
        });

        // 터치 디바이스 드래그 대응
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                const rect = canvas.getBoundingClientRect();
                if (player) {
                    player.targetX = e.touches[0].clientX - rect.left;
                    player.targetY = e.touches[0].clientY - rect.top;
                }
            }
        }, { passive: true });

        // 마우스 클릭 시 필살기 시도
        window.addEventListener('click', () => {
            if (isGameRunning) triggerUltimateSkill();
        });

        // 스페이스바 입력 시 필살기 시도
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && isGameRunning) {
                triggerUltimateSkill();
            }
        });

        // 게임 시작 버튼 클릭 이벤트
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 오버레이 클릭 시 필살기 발동 스킵
            startGame();
        });

        // 초당 60프레임 액션 게임 루프 시작!
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
